<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ghita Store | متجر إلكترونيات وألعاب</title>
<meta name="theme-color" content="#FBF7EF">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Changa:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF7EF; --paper2:#F2EBDD; --ink:#14120E; --ink2:#5B5547;
    --orange:#FF6A1A; --orange-d:#E5560A; --sun:#FFD23F; --green:#1FA463; --red:#E5484D; --navy:#1B2A49;
  }
  html{ scroll-behavior:smooth; }
  body{ background:var(--paper); color:var(--ink); font-family:'IBM Plex Sans Arabic','Tajawal',sans-serif; -webkit-font-smoothing:antialiased; }
  .font-brand{ font-family:'Changa','IBM Plex Sans Arabic',sans-serif; letter-spacing:-.01em; }
  .font-num{ font-family:'Cairo','IBM Plex Sans Arabic',sans-serif; }
  ::selection{ background:var(--sun); color:var(--ink); }
  :focus-visible{ outline:3px solid var(--orange); outline-offset:2px; border-radius:8px; }
  .line-clamp-2{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .scrollbar-hide::-webkit-scrollbar{ display:none; }
  .scrollbar-hide{ -ms-overflow-style:none; scrollbar-width:none; }

  /* ---- animations ---- */
  @keyframes fadeIn{ from{opacity:0; transform:translate(-50%,10px);} to{opacity:1; transform:translate(-50%,0);} }
  [dir="rtl"] .slide-in{ animation:slideInRTL .28s cubic-bezier(.16,1,.3,1); }
  @keyframes slideInRTL{ from{transform:translateX(100%);} to{transform:translateX(0);} }
  @keyframes popIn{ from{opacity:0; transform:translateY(12px) scale(.97);} to{opacity:1; transform:none;} }
  .toast-anim{ animation:fadeIn .2s ease; }
  .toast-pop{ animation:popIn .2s ease; }
  @keyframes bob{ 0%,100%{ transform:translateY(0) rotate(var(--r,0deg)); } 50%{ transform:translateY(-8px) rotate(var(--r,0deg)); } }
  .bob{ animation:bob 5s ease-in-out infinite; }
  @keyframes scroll{ to{ transform:translateX(-50%); } }

  /* ---- building blocks ---- */
  .card{ background:#fff; border:2px solid var(--ink); border-radius:20px; }
  .panel{ background:var(--paper2); border:2px solid var(--ink); border-radius:20px; }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:.5rem; font-weight:700; border:2px solid var(--ink); border-radius:999px; padding:.65rem 1.3rem; cursor:pointer; transition:transform .15s, box-shadow .15s, background .15s; background:#fff; color:var(--ink); font-size:.95rem; }
  .btn:hover:not(:disabled){ transform:translateY(-2px); box-shadow:0 4px 0 var(--ink); }
  .btn:active:not(:disabled){ transform:translateY(0); box-shadow:none; }
  .btn:disabled{ opacity:.35; cursor:not-allowed; }
  .btn-primary{ background:var(--orange); color:#fff; }
  .btn-ink{ background:var(--ink); color:var(--paper); }
  .btn-sun{ background:var(--sun); }
  .btn-wa{ background:#25D366; color:#fff; }
  .btn-sm{ padding:.4rem .9rem; font-size:.82rem; }
  .btn-icon{ width:2.4rem; height:2.4rem; padding:0; font-size:1.05rem; }
  .chip{ display:inline-flex; align-items:center; gap:.4rem; border:2px solid var(--ink); border-radius:999px; padding:.4rem 1rem; font-weight:600; font-size:.88rem; background:#fff; cursor:pointer; transition:.15s; white-space:nowrap; }
  .chip:hover{ background:var(--sun); }
  .chip.on{ background:var(--ink); color:var(--paper); }
  .chip-sm{ padding:.2rem .75rem; font-size:.78rem; border-width:1.5px; }
  .field{ width:100%; background:#fff; border:2px solid var(--ink); border-radius:14px; padding:.65rem .95rem; font-size:.95rem; outline:none; transition:box-shadow .15s; color:var(--ink); }
  .field:focus{ box-shadow:0 0 0 4px rgba(255,106,26,.25); border-color:var(--orange); }
  .field::placeholder{ color:#9A9382; }
  .label{ display:block; font-weight:700; font-size:.85rem; margin-bottom:.35rem; }
  .tag{ display:inline-block; font-size:.7rem; font-weight:700; border:1.5px solid var(--ink); border-radius:999px; padding:.05rem .6rem; background:var(--sun); }
  .price{ font-family:'Cairo',sans-serif; font-weight:800; }
  mark{ background:var(--sun); color:var(--ink); border-radius:4px; padding:0 2px; }

  /* product card */
  .pcard{ background:#fff; border:2px solid var(--ink); border-radius:22px; overflow:hidden; display:flex; flex-direction:column; cursor:pointer; transition:transform .2s, box-shadow .2s; }
  .pcard:hover{ transform:translateY(-5px); box-shadow:0 8px 0 var(--ink); }
  .pimg{ position:relative; aspect-ratio:1/1; background:var(--paper2); overflow:hidden; border-bottom:2px solid var(--ink); }
  .pimg img{ width:100%; height:100%; object-fit:cover; transition:transform .4s; }
  .pcard:hover .pimg img{ transform:scale(1.06); }
  .sticker{ position:absolute; top:.6rem; right:.6rem; background:var(--red); color:#fff; font-size:.7rem; font-weight:800; border:2px solid var(--ink); border-radius:999px; padding:.1rem .65rem; transform:rotate(4deg); }

  .dots{ background-image:radial-gradient(rgba(20,18,14,.13) 1.2px, transparent 1.2px); background-size:18px 18px; }
  .ticker{ display:flex; width:max-content; animation:scroll 28s linear infinite; direction:ltr; }
  @media (prefers-reduced-motion:reduce){ *{ animation-duration:.001ms !important; transition-duration:.001ms !important; } }
</style>

function productGallery(imageKey, id){

  return [productImage(id)];
}

let toastTimer = null;

/* حفظ السلة في المتصفح عشان متضيعش مع تحديث الصفحة */
const CART_KEY = "ghita-cart-v1";
function saveCart(){ try{ localStorage.setItem(CART_KEY, JSON.stringify(state.cart)); }catch(e){} }
function loadCart(){
  try{
    const saved = JSON.parse(localStorage.getItem(CART_KEY)||"[]");
    if(!Array.isArray(saved)) return;
    state.cart = saved
      .filter(l=>l && Number.isInteger(l.id) && Number.isInteger(l.qty) && l.qty>0)
      .map(l=>{ const p = findProduct(l.id); return p && p.stock>0 ? { id:l.id, qty:Math.min(l.qty,p.stock) } : null; })
      .filter(Boolean);
  }catch(e){}
}

/* ================================================================== */
/* أدوات مساعدة                                                        */
/* ================================================================== */
function egp(n){ return Number(n).toLocaleString("ar-EG") + " ج.م"; }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function catName(id){ const c = CATEGORIES.find(c=>c.id===id); return c ? c.name : ""; }
function findProduct(id){ return state.products.find(p=>p.id===id); }

function highlight(text, query){
  if(!query) return esc(text);
  const idx = text.toLowerCase().indexOf(query.toLowerCase());
  if(idx===-1) return esc(text);
  return esc(text.slice(0,idx)) + "<mark>" + esc(text.slice(idx, idx+query.length)) + "</mark>" + esc(text.slice(idx+query.length));
}

function showToast(msg){
  state.toast = msg;
  render();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ state.toast=null; render(); }, 2200);
}

/* ================================================================== */
/* منطق السلة                                                          */
/* ================================================================== */
function cartLines(){
  return state.cart.map(l=>{ const p = findProduct(l.id); return p ? {...p, qty:l.qty} : null; }).filter(Boolean);
}
function cartCount(){ return cartLines().reduce((s,l)=>s+l.qty,0); }
function subtotal(){ return cartLines().reduce((s,l)=>s+l.qty*l.price,0); }
function deliveryFee(){ const st = subtotal(); return st>0 ? (st>=1000?0:35) : 0; }
function total(){ return subtotal() + deliveryFee(); }

function addToCart(id, qty=1){
  const product = findProduct(id);
  if(!product || product.stock<=0) return;
  const existing = state.cart.find(l=>l.id===id);
  const currentQty = existing ? existing.qty : 0;
  const nextQty = Math.min(product.stock, currentQty+qty);
  if(existing) existing.qty = nextQty;
  else state.cart.push({ id, qty: nextQty });
  saveCart();
  showToast("تمت إضافة «" + product.name + "» إلى السلة");
}
function updateQty(id, delta){
  const line = state.cart.find(l=>l.id===id);
  if(!line) return;
  const product = findProduct(id);
  const max = product ? product.stock : 99;
  line.qty = Math.max(1, Math.min(max, line.qty+delta));
  saveCart();
  render();
}
function removeFromCart(id){
  state.cart = state.cart.filter(l=>l.id!==id);
  saveCart();
  render();
}

/* ---------------------- الملف الشخصي وتسجيل الدخول بجوجل ---------------------- */
function toggleProfile(){
  state.view = state.view==="profile" ? "store" : "profile";
  render();
}
function parseJwt(token){
  try{
    const base64Url = token.split(".")[1];
    const base64 = base64Url.replace(/-/g, "+").replace(/_/g, "/");
    const json = decodeURIComponent(
      atob(base64).split("").map(c => "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2)).join("")
    );
    return JSON.parse(json);
  }catch(e){ return null; }
}
function handleGoogleCredentialResponse(response){
  const payload = parseJwt(response.credential);
  if(!payload) return;
  state.profile = {
    signedIn: true,
    name: payload.name || "",
    email: payload.email || "",
    picture: payload.picture || "",
  };
  render();
}
function signOutProfile(){
  state.profile = { signedIn:false, name:"", email:"", picture:"" };
  if(window.google && google.accounts && google.accounts.id){
    google.accounts.id.disableAutoSelect();
  }
  render();
}
let googleInitDone = false;
let googleRetryTimer = null;
function initGoogleSignInIfNeeded(){
  if(state.view!=="profile" || state.profile.signedIn) return;
  const container = document.getElementById("google-signin-btn");
  if(!container || container.dataset.rendered) return;
  if(!window.google || !google.accounts || !google.accounts.id){
    // مكتبة جوجل لسه بتحمل، جرّب تاني بعد شوية (مؤقّت واحد بس بدل ما يتكرروا مع كل render)
    clearTimeout(googleRetryTimer);
    googleRetryTimer = setTimeout(initGoogleSignInIfNeeded, 300);
    return;
  }
  if(!googleInitDone){
    google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleGoogleCredentialResponse });
    googleInitDone = true;
  }
  container.dataset.rendered = "1";
  container.innerHTML = "";
  google.accounts.id.renderButton(container, {
    theme: "filled_black",
    size: "large",
    shape: "pill",
    text: "signin_with",
    width: 280,
  });
}

/* ---------------------- المساعد الذكي (شات AI) ---------------------- */
function toggleAiChat(){
  state.aiChat.open = !state.aiChat.open;
  render();
}
function closeAiChat(){
  state.aiChat.open = false;
  render();
}
async function sendAiChatMessage(){
  const text = state.aiChat.input.trim();
  if(!text || state.aiChat.sending) return;

  state.aiChat.messages.push({ role:"user", text });
  state.aiChat.input = "";
  state.aiChat.sending = true;
  render();

  try{
    const res = await fetch(`${API_BASE_URL}/api/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        message: text,
        previousInteractionId: state.aiChat.previousInteractionId,
        products: state.products.map(p=>({ id:p.id, name:p.name, price:p.price, stock:p.stock, category:p.category })),
      }),
    });
    if(!res.ok) throw new Error("bad-response");
    const data = await res.json();
    if(data.previousInteractionId) state.aiChat.previousInteractionId = data.previousInteractionId;
    state.aiChat.messages.push({ role:"assistant", text: data.reply || "معلش حصل خطأ بسيط، جرّب تاني." });
    if(data.escalateToWhatsapp){
      state.aiChat.messages.push({ role:"assistant", text:"لو حابب تتكلم مع صاحب المتجر مباشرة، اضغط هنا:", whatsappHref: `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(text)}` });
    }
  }catch(err){
    state.aiChat.messages.push({
      role:"assistant",

/* ---------------------- بناء رسالة واتساب التلقائية ---------------------- */
function buildWhatsappMessage(order){
  const lines = order.items.map(it => `• ${it.name}  ×${it.qty}   —   ${egp(it.price*it.qty)}`).join("\n");
  return (
`✨ *طلب جديد من Ghita Store* ✨

🧾 رقم الطلب: *${order.id}*
📅 التاريخ: ${order.date}

👤 *بيانات العميل*
الاسم: ${order.customer.name}
الهاتف: ${order.customer.phone}
القرية: ${order.customer.village}
العنوان: ${order.customer.address}

🛍️ *تفاصيل الطلب*
${lines}

————————————
المجموع الفرعي: ${egp(order.subtotal)}
التوصيل: ${order.delivery===0 ? "مجانًا 🎉" : egp(order.delivery)}
💰 *الإجمالي: ${egp(order.total)}*

شكرًا لطلبك من Ghita Store 🙏`
  );
}

function sendOrderToWhatsapp(order, win){
  const text = buildWhatsappMessage(order);
  const url = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(text);
  if(win && !win.closed){ win.location.href = url; }
  else { const w = window.open(url, "_blank", "noopener"); if(!w) showToast("اضغط زر واتساب لإرسال الطلب"); }
}

/* تحويل الأرقام العربية (٠-٩) لإنجليزي + فحص رقم موبايل مصري */
function normalizeDigits(str){
  return String(str||"").replace(/[\u0660-\u0669]/g, d=>String(d.charCodeAt(0)-0x0660)).replace(/[\u06F0-\u06F9]/g, d=>String(d.charCodeAt(0)-0x06f0));
}
function normalizePhone(str){ return normalizeDigits(str).replace(/[\s-]/g,""); }
function isValidEgyptPhone(p){ return /^01[0125]\d{8}$/.test(p); }

let placingOrder = false;
async function placeOrder(){
  if(placingOrder) return;
  const lines = cartLines();
  if(lines.length===0) return;

  const f = state.checkoutForm;
  const customer = {
    name: (f.name||"").replace(/\s+/g," ").trim(),
    phone: normalizePhone(f.phone),
    village: f.village,
    address: (f.address||"").replace(/\s+/g," ").trim(),
  };
  if(customer.name.length<2){ showToast("اكتب اسمك من فضلك"); return; }
  if(!isValidEgyptPhone(customer.phone)){ showToast("رقم الهاتف غير صحيح — لازم 11 رقم ويبدأ بـ 01"); return; }
  if(!VILLAGES.includes(customer.village)){ showToast("اختر القرية من القائمة"); return; }
  if(customer.address.length<5){ showToast("اكتب العنوان بالتفصيل"); return; }

  placingOrder = true;
  // نفتح نافذة واتساب فورًا (داخل ضغطة المستخدم) عشان المتصفح ميمنعهاش لو استنينا رد السيرفر
  const waWin = window.open("", "_blank");
  if(waWin) waWin.opener = null;

  let orderId = "GHT-" + Date.now().toString(36).toUpperCase();
  let sub = subtotal(), delivery = deliveryFee(), tot = total();

  // لو الباك اند متوصل: السيرفر هو المرجع في السعر والمخزون ورقم الطلب
  if(API_BASE_URL){
    try{
      const res = await fetch(`${API_BASE_URL}/api/orders`, {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ ...customer, items: lines.map(l=>({ id:l.id, qty:l.qty })) }),
      });
      if(res.status>=400 && res.status<500){
        const err = await res.json().catch(()=>({}));
        if(waWin) waWin.close();
        placingOrder = false;
        showToast(err.error || "تعذّر إرسال الطلب");
        return;
      }
      if(res.ok){
        const data = await res.json();
        orderId = data.order.id; sub = data.order.subtotal; delivery = data.order.delivery; tot = data.order.total;
      }
    }catch(e){ /* السيرفر مش متاح: نكمل محليًا ونبعت الطلب عبر واتساب */ }
  }

  const order = {
    id: orderId,
    date: new Date().toLocaleDateString("ar-EG"),
    items: lines.map(l=>({ id:l.id, name:l.name, qty:l.qty, price:l.price })),
    subtotal: sub, delivery, total: tot,
    customer,
  };
  state.orders.unshift(order);
  lines.forEach(l=>{ const p = findProduct(l.id); if(p) p.stock = Math.max(0, p.stock - l.qty); });
  state.cart = [];
  saveCart();
  state.lastOrderId = orderId;
  state.view = "confirm";
  state.cartOpen = false;
  placingOrder = false;
  render();
  sendOrderToWhatsapp(order, waWin);
}

function addNewProduct(){
  const np = state.newProduct;
  if(!np.name || !np.price) return;
  const id = Math.max(0, ...state.products.map(p=>p.id)) + 1;
  state.products.push({
    id, name: np.name, category: np.category,
    price: Number(np.price)||0, stock: Number(np.stock)||0,
    rating: 4.5, subcategory: null, image: productImage(id), gallery: [productImage(id)],
  });
  state.newProduct = { name:"", category:"electronics", price:"", stock:"" };
  showToast("تمت إضافة المنتج الجديد");
}
function deleteProduct(id){
  state.products = state.products.filter(p=>p.id!==id);
  state.cart = state.cart.filter(l=>l.id!==id);
  saveCart();
  render();
}
function updateProductField(id, field, value){
  const p = findProduct(id);
  if(p) p[field] = value;
}

/* ================================================================== */
function normalizedQuery(){ return state.query.trim().toLowerCase(); }
function suggestions(){
  const q = normalizedQuery();
  if(!q) return [];
  return state.products.filter(p=>p.name.toLowerCase().includes(q)).slice(0,6);
}
function filteredProducts(){
  const q = normalizedQuery();
  return state.products.filter(p=>{
    const mq = q ? p.name.toLowerCase().includes(q) : true;
    const mc = state.category==="all" ? true : p.category===state.category;
    const msc = (state.category==="games" && state.subcategory!=="all") ? p.subcategory===state.subcategory : true;
    return mq && mc && msc;
  });
}

/* الريندر الرئيسي                                                     */
/* ================================================================== */
function render(){
  const activeEl = document.activeElement;
  const activeId = activeEl ? activeEl.id : null;
  const selStart = activeEl && "selectionStart" in activeEl ? activeEl.selectionStart : null;

  let body = "";
  if(state.view==="store") body = storeViewTemplate();
  else if(state.view==="checkout") body = checkoutViewTemplate();
  else if(state.view==="confirm") body = confirmViewTemplate();
  else if(state.view==="admin") body = adminViewTemplate();
  else if(state.view==="profile") body = profileViewTemplate();

  document.getElementById("app").innerHTML = `
    <div class="min-h-screen">
      ${headerTemplate()}
      ${toastTemplate()}
      ${body}
      ${cartDrawerTemplate()}
      ${quickViewTemplate()}
      ${galleryModalTemplate()}
      ${footerTemplate()}
      ${aiChatWidgetTemplate()}
    </div>`;

  if(activeId){
    const el = document.getElementById(activeId);
    if(el){ el.focus(); if(selStart!=null && el.setSelectionRange) { try{ el.setSelectionRange(selStart, selStart); }catch(e){} } }
  }

  const chatScroll = document.getElementById("ai-chat-scroll");
  if(chatScroll) chatScroll.scrollTop = chatScroll.scrollHeight;

  initGoogleSignInIfNeeded();
}

/* ================================================================== */
/* ربط الأحداث (تفويض الأحداث Event Delegation)                        */
/* ================================================================== */
document.addEventListener("click", (e)=>{
  const el = e.target.closest("[data-action]");
  if(!el) return;
  const action = el.dataset.action;

  if(action==="go-store"){ state.view="store"; render(); }
  else if(action==="toggle-admin"){ state.view = state.view==="admin" ? "store" : "admin"; render(); }
  else if(action==="toggle-profile"){ toggleProfile(); }
  else if(action==="sign-out"){ signOutProfile(); }
  else if(action==="toggle-ai-chat"){ toggleAiChat(); }
  else if(action==="close-ai-chat"){ closeAiChat(); }
  else if(action==="open-cart"){ state.cartOpen=true; render(); }
  else if(action==="close-cart"){ state.cartOpen=false; render(); }
  else if(action==="clear-query"){ state.query=""; render(); }
  else if(action==="quickview"){ state.quickViewId = Number(el.dataset.id); state.query=""; render(); }
  else if(action==="close-quickview"){ state.quickViewId=null; render(); }
  else if(action==="set-category"){ state.category = el.dataset.cat; state.subcategory = "all"; render(); }
  else if(action==="set-subcategory"){ state.subcategory = el.dataset.sub; render(); }
  else if(action==="open-gallery"){ state.galleryProductId = Number(el.dataset.id); state.galleryIndex = 0; render(); }
  else if(action==="close-gallery"){ state.galleryProductId = null; render(); }
  else if(action==="gallery-thumb"){ state.galleryIndex = Number(el.dataset.idx); render(); }
  else if(action==="add-cart-close-gallery"){ addToCart(Number(el.dataset.id)); state.galleryProductId=null; render(); }
  else if(action==="add-cart"){ addToCart(Number(el.dataset.id)); render(); }
  else if(action==="add-cart-close"){ addToCart(Number(el.dataset.id)); state.quickViewId=null; render(); }
  else if(action==="qty"){ updateQty(Number(el.dataset.id), Number(el.dataset.delta)); }
  else if(action==="remove-cart"){ removeFromCart(Number(el.dataset.id)); }
  else if(action==="go-checkout"){ state.cartOpen=false; state.view="checkout"; render(); }
  else if(action==="admin-tab"){ state.adminTab = el.dataset.tab; render(); }
  else if(action==="delete-product"){ deleteProduct(Number(el.dataset.id)); }
  else if(action==="resend-wa"){
    const o = state.orders.find(o=>o.id===el.dataset.id);
    if(o) sendOrderToWhatsapp(o);
  }
});

document.addEventListener("keydown", (e)=>{
  if(e.key==="Escape"){
    if(state.galleryProductId){ state.galleryProductId=null; render(); }
    else if(state.quickViewId){ state.quickViewId=null; render(); }
    else if(state.cartOpen){ state.cartOpen=false; render(); }
    else if(state.aiChat.open){ state.aiChat.open=false; render(); }
  } else if((e.key==="Enter"||e.key===" ") && e.target.matches && e.target.matches('div[data-action][role="button"]')){
    e.preventDefault(); e.target.click();
  }
});

document.addEventListener("change", (e)=>{
  const el = e.target;
  if(el.dataset && el.dataset.action==="edit-field"){
    const val = el.dataset.field==="price" || el.dataset.field==="stock" ? Number(el.value) : el.value;
    updateProductField(Number(el.dataset.id), el.dataset.field, val);
  }
  const bind = el.dataset ? el.dataset.bind : null;
  if(bind==="checkout.village"){ state.checkoutForm.village = el.value; }
  if(bind==="newProduct.category"){ state.newProduct.category = el.value; }
});

document.addEventListener("input", (e)=>{
  const el = e.target;
  const bind = el.dataset ? el.dataset.bind : null;
  if(!bind) return;

  if(bind==="query"){ state.query = el.value; render(); return; }
  if(bind==="checkout.name"){ state.checkoutForm.name = el.value; return; }
  if(bind==="checkout.phone"){ state.checkoutForm.phone = el.value; return; }
  if(bind==="checkout.address"){ state.checkoutForm.address = el.value; return; }
  if(bind==="newProduct.name"){ state.newProduct.name = el.value; return; }
  if(bind==="newProduct.price"){ state.newProduct.price = el.value; return; }
  if(bind==="newProduct.stock"){ state.newProduct.stock = el.value; return; }
  if(bind==="aiChat.input"){ state.aiChat.input = el.value; return; }
});

document.addEventListener("submit", (e)=>{
  if(e.target && e.target.id==="checkout-form"){
    e.preventDefault();
    placeOrder();
  }
  if(e.target && e.target.id==="new-product-form"){
    e.preventDefault();
    addNewProduct();
    render();
  }
  if(e.target && e.target.id==="ai-chat-form"){
    e.preventDefault();
    sendAiChatMessage();
  }
});

/* ================================================================== */
/* الإقلاع                                                             */
/* ================================================================== */
loadCart();
render();
</script>
</body>
</html>
